name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # boto3 clients are created at import time in the lambdas; they need a
      # region to construct but no credentials, since no test makes a real call
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            lambdas/layers/common/requirements.txt

      # pypdf is vendored into the layer for deploys and gitignored, so a
      # fresh checkout doesn't have it - install it the normal way here
      - run: pip install -r tests/requirements.txt -r lambdas/layers/common/requirements.txt

      - run: python -m pytest tests/ -q

  deploy:
    # Only runs on a push to main, after the tests pass, and only once the
    # repo variable AWS_DEPLOY_ROLE_ARN exists (see infrastructure/iam/README.md).
    # Until that role is created this job is skipped rather than failing, so
    # the workflow stays green.
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job request a short-lived OIDC token; no stored AWS keys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install -r infrastructure/requirements.txt

      # the shared layer is built from lambdas/layers/common/python, where
      # pypdf is vendored (gitignored) - same step as the README's local setup
      - run: pip install -r lambdas/layers/common/requirements.txt -t lambdas/layers/common/python

      - run: npm install -g aws-cdk@2

      # TEMPORARY: print the OIDC token's claims (never the token itself) as
      # annotations, to see what the role's trust policy is being matched against
      - name: debug oidc claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 -c "import sys,json,base64; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); [print('::notice title=oidc '+k+'::'+str(c.get(k))) for k in ('iss','aud','sub','ref','repository','job_workflow_ref')]" "$TOKEN"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - run: cdk deploy InfrastructureStack --require-approval never
        working-directory: infrastructure
